[package]
name = "smart-focus"
version = "0.1.0-rc.2"
edition = "2024"

[dependencies]
anyhow = "1"
libc = "0.2"
prost = "0.14"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
