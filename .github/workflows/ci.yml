name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: format and evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix fmt -- --check .
      - run: nix flake check --all-systems --no-build
      - run: nix eval --raw .#darwinConfigurations.mac.system.drvPath
